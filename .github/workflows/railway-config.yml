name: Railway config

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
    paths:
      - ".railway/**"
      - ".github/workflows/railway-config.yml"

permissions:
  contents: read

concurrency:
  group: railway-config-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check Railway declaration
    if: ${{ github.event.action != 'closed' && github.event.pull_request.draft !=
      true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize Railway configuration mode
        env:
          PRODUCTION_ENABLED: ${{ vars.RAILWAY_PRODUCTION_ENABLED == 'true' }}
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$PRODUCTION_ENABLED" != true ]; then
            echo 'Production plan and apply are disabled. This migration repository runs declaration checks only until RAILWAY_PRODUCTION_ENABLED is set to true at cutover.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SAME_REPOSITORY" != true ]; then
            echo 'Production mode is enabled. Fork pull requests run declaration checks only.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Production mode is enabled. Review the authenticated plan before merging. Apply on merge requires the pinned plan.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .railway/go.mod
          cache-dependency-path: .railway/go.sum
      - name: Check Go module
        working-directory: .railway
        run: |
          go test ./...
          go vet ./...

  plan:
    needs: check
    if: ${{ vars.RAILWAY_PRODUCTION_ENABLED == 'true' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .railway/go.mod
          cache-dependency-path: .railway/go.sum
      - uses: railwayapp/config@71a26b7e0f7abd0a2c5700007f2dfe2722c1fb4e # post-v1.2.0 package-manager support
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          # The declaration uses the Go SDK in .railway/go.mod.
          package-manager: none

  apply:
    if: ${{ vars.RAILWAY_PRODUCTION_ENABLED == 'true' &&
      github.event.action == 'closed' && github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: railwayapp/config@71a26b7e0f7abd0a2c5700007f2dfe2722c1fb4e # post-v1.2.0 package-manager support
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
