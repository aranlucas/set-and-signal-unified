name: Railway config

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - closed
    paths:
      - ".railway/**"
      - ".github/workflows/railway-config.yml"

permissions:
  contents: read

concurrency:
  group: railway-config-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check Railway declaration
    if: ${{ github.event.action != 'closed' && github.event.pull_request.draft !=
      true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .railway/go.mod
          cache-dependency-path: .railway/go.sum
      - name: Check Go module
        working-directory: .railway
        run: |
          go test ./...
          go vet ./...

  plan:
    needs: check
    if: ${{ github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .railway/go.mod
          cache-dependency-path: .railway/go.sum
      - uses: railwayapp/config@71a26b7e0f7abd0a2c5700007f2dfe2722c1fb4e # post-v1.2.0 package-manager support
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          # The declaration uses the Go SDK in .railway/go.mod.
          package-manager: none

  apply:
    if: ${{ github.event.action == 'closed' && github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - uses: railwayapp/config@71a26b7e0f7abd0a2c5700007f2dfe2722c1fb4e # post-v1.2.0 package-manager support
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
