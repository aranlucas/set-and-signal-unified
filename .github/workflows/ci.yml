name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Shared training contracts and policies
        run: pnpm check:shared

      # Share Go's compilation cache sequentially and keep typed lint from
      # competing with three Go compiler/analyzer trees on the hosted runner.
      - name: Go test (race)
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...

      - name: Go modernization fixes
        run: go fix -diff ./...

      - name: Formatting and web lint
        run: pnpm format:check && pnpm --dir web lint:strict

      - name: Web test
        run: pnpm --dir web test

      - name: Check generated shared exercise catalogue
        run: git diff --exit-code -- packages/exercises/catalog.json

      # Vite clears web/dist, which the Go checks read through go:embed.
      # Wait for those checks to finish before replacing the embedded tree.
      - name: Web typecheck and build
        run: pnpm --dir web build

      - name: Check whitespace
        run: git diff --check
