packages:
  - web
  - packages/*
  - apps/android
  - apps/garmin
  - apps/garmin/codegen

minimumReleaseAge: 0
trustPolicyExclude:
  - semver@6.3.1
  - reselect@5.1.1
allowBuilds:
  "@swc/core": true
  esbuild: true
  workerd: false
patchedDependencies:
  # React Compiler 1.0.0 still treats destructuring defaults as LVal nodes.
  # Babel 8 separates AssignmentPattern: https://babeljs.io/docs/v8-migration-api/
  babel-plugin-react-compiler@1.0.0: patches/babel-plugin-react-compiler@1.0.0.patch
